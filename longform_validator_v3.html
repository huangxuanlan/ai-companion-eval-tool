    <script>
        // Init Icons
        feather.replace()

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.contains('dark');

            if (isDark) {
                document.documentElement.classList.remove('dark');
                localStorage.theme = 'light';
            } else {
                document.documentElement.classList.add('dark');
                localStorage.theme = 'dark';
            }
        });

        // Demo Top Nav Toggling Mechanism 
        const navBtns = document.querySelectorAll('#top-nav .nav-btn');
        navBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                navBtns.forEach(b => {
                    b.classList.remove('active', 'bg-text-primary', 'text-bg-base', 'border', 'border-border-solid', 'shadow-sm');
                    b.classList.add('text-text-secondary', 'hover:text-text-primary', 'hover:bg-bg-hover');
                });
                const target = e.currentTarget;
                target.classList.add('active', 'bg-text-primary', 'text-bg-base', 'border', 'border-border-solid', 'shadow-sm');
                target.classList.remove('text-text-secondary', 'hover:text-text-primary', 'hover:bg-bg-hover');
            });
        });

        // Demo Mock Logic to trigger the inspector view
        const runTestBtn = document.getElementById('run-test-btn');
        runTestBtn.addEventListener('click', () => {
            // Update button state
            runTestBtn.innerHTML = '<div class="w-3 h-3 bg-bg-base rounded-sm animate-pulse mr-2"></div> Running...';

            // Populate the right side panel with mockup data
            const inspectorPanel = document.getElementById('inspector-content');
            inspectorPanel.innerHTML = `
                <!-- Empty state before interactions -->
                <div class="h-full flex flex-col items-center justify-center text-text-muted/50 p-6 text-center">
                    <i data-feather="activity" class="w-8 h-8 mb-3 opacity-50"></i>
                    <p class="text-xs uppercase tracking-wider font-semibold">Inspector Idle</p>
                    <p class="text-[10px] mt-1">Waiting for session initialization...</p>
                </div>`;

            // Re-bind feather icons
            feather.replace();

            setTimeout(() => {
                runTestBtn.innerHTML = '寮€濮嬪洖褰掓祴璇?(Ctrl+Enter)';
            }, 3000);
        });

    </script>
